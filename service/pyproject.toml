[project]
name = "traffictracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.0",
    "prometheus-client>=0.21.0",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
# Only installed into the speed-limit job's own image (see
# Dockerfile.speedlimit-job) -- kept out of the always-on poller/api image
# so its minimal, continuously-running footprint doesn't grow for a
# once-a-month job.
job = [
    "shapely>=2.0.0",
    "ijson>=3.3.0",
]

[build-system]
requires = ["uv_build>=0.5.0,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
